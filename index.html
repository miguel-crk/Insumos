<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F3864">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Insumos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Insumos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    (function () {
      var m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      document.documentElement.setAttribute('data-bs-theme', m && m.matches ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title">Insumos</div>
    <div id="status" class="status" role="status">Cargando…</div>
  </header>

  <main class="app-main">
    <section id="view-buscar">
      <div class="search-wrap">
        <input id="q" type="search" class="form-control form-control-lg" placeholder="Código o modelo de impresora"
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search"
               aria-label="Buscar por código o modelo">
        <button id="qclear" class="qclear" type="button" aria-label="Borrar búsqueda" hidden>&times;</button>
      </div>
      <div id="results" class="mt-3"></div>
    </section>

    <section id="view-cargar" hidden>
      <div class="btn-group w-100 mb-2" role="group" aria-label="Qué cargar">
        <button type="button" class="btn btn-outline-primary active" data-seg="productos">Productos</button>
        <button type="button" class="btn btn-outline-primary" data-seg="impresoras">Impresoras</button>
      </div>
      <div class="d-flex gap-2 mb-2">
        <input id="lf" type="search" class="form-control" placeholder="Filtrar…" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button id="newbtn" type="button" class="btn btn-primary text-nowrap">+ Nuevo</button>
      </div>
      <div id="list"></div>
    </section>

    <section id="view-ajustes" hidden>
      <div class="card mb-3"><div class="card-body">
        <h2 class="h6">Conexión</h2>
        <p class="small text-body-secondary mb-2">El PIN es el que configuraste en el script. Se guarda solo en este teléfono.</p>
        <input id="pin" type="password" class="form-control mb-2" placeholder="PIN" autocomplete="off" aria-label="PIN">
        <input id="url" type="url" class="form-control mb-2" placeholder="URL del script (termina en /exec)" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="URL del script">
        <p class="small text-body-secondary mb-2">Dejá la URL vacía para usar la que viene incluida en la app.</p>
        <button id="pinsave" class="btn btn-primary w-100" type="button">Guardar y sincronizar</button>
      </div></div>
      <div class="card mb-3"><div class="card-body">
        <h2 class="h6">Datos</h2>
        <p id="info" class="small mb-2"></p>
        <div class="d-grid gap-2">
          <button id="syncnow" type="button" class="btn btn-outline-primary">Sincronizar ahora</button>
          <button id="install" type="button" class="btn btn-outline-success" hidden>Instalar la app</button>
          <button id="wipe" type="button" class="btn btn-outline-danger">Borrar datos de este teléfono</button>
        </div>
      </div></div>
      <p class="small text-body-secondary">Para instalarla: en Chrome, menú &#8942; &rarr; Agregar a la pantalla principal.</p>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Secciones">
    <button type="button" class="active" data-view="buscar"><span class="ico">&#128269;</span>Buscar</button>
    <button type="button" data-view="cargar"><span class="ico">&#9998;</span>Cargar</button>
    <button type="button" data-view="ajustes"><span class="ico">&#9881;</span>Ajustes</button>
  </nav>

  <div id="overlay" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <strong id="sheet-title"></strong>
        <button id="sheet-close" type="button" class="btn-close" aria-label="Cerrar"></button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast-msg" hidden></div>

  <script src="vendor/fuse.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
